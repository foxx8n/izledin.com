<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">izledin.com logo</title>
  <desc id="desc">Brutalist cinema logo combining a film frame, an eye and a play symbol, with the izledin.com wordmark.</desc>

  <defs>
    <filter id="rough" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency=".025" numOctaves="2" seed="7" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="0.55"/>
    </filter>
  </defs>

  <!-- ICON -->
  <g transform="translate(38 48)">
    <!-- hard offset / neobrutalist shadow -->
    <path d="M18 22h278v188H18z" fill="#DC2626" transform="translate(9 9)"/>
    <!-- film frame -->
    <rect x="0" y="0" width="278" height="188" fill="#0A0A0A"/>
    <!-- sprocket holes -->
    <g fill="#FFFFFF">
      <rect x="16" y="16" width="30" height="24"/>
      <rect x="16" y="52" width="30" height="24"/>
      <rect x="16" y="112" width="30" height="24"/>
      <rect x="16" y="148" width="30" height="24"/>
      <rect x="232" y="16" width="30" height="24"/>
      <rect x="232" y="52" width="30" height="24"/>
      <rect x="232" y="112" width="30" height="24"/>
      <rect x="232" y="148" width="30" height="24"/>
    </g>

    <!-- eye -->
    <path d="M61 94C91 52 126 31 139 31s48 21 78 63c-30 42-65 63-78 63S91 136 61 94Z" fill="#FAFAFA"/>
    <!-- iris -->
    <circle cx="139" cy="94" r="43" fill="#0A0A0A"/>
    <circle cx="139" cy="94" r="34" fill="#DC2626"/>
    <!-- play -->
    <path d="M130 74l29 20-29 20z" fill="#FFFFFF"/>
    <!-- small film-cut marks -->
    <path d="M0 82h10v24H0zM268 82h10v24h-10z" fill="#FFFFFF"/>
  </g>

  <!-- WORDMARK -->
  <g font-family="Geist, Arial, Helvetica, sans-serif" font-weight="900">
    <text x="355" y="184" font-size="128" letter-spacing="-6" fill="#0A0A0A">izledin</text>
    <!-- .com block -->
    <rect x="970" y="92" width="184" height="94" fill="#DC2626"/>
    <rect x="978" y="100" width="184" height="94" fill="#0A0A0A" transform="translate(6 6)"/>
    <rect x="970" y="92" width="184" height="94" fill="#DC2626"/>
    <text x="986" y="163" font-size="62" letter-spacing="-2" fill="#FFFFFF">.com</text>
  </g>

  <!-- divider -->
  <rect x="355" y="214" width="799" height="5" fill="#0A0A0A"/>
  <rect x="355" y="214" width="210" height="5" fill="#DC2626"/>

  <!-- mono signature -->
  <text x="355" y="255"
        font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="18" font-weight="800" letter-spacing="3.2" fill="#525252">
    İZLE · KAYDET · PAYLAŞ · TARTIŞ
  </text>

  <!-- micro mark -->
  <text x="1154" y="255"
        text-anchor="end"
        font-family="Geist Mono, ui-monospace, SFMono-Regular, Menlo, monospace"
        font-size="14" font-weight="900" letter-spacing="1.5" fill="#DC2626">
    CINE / SOCIAL / LOG
  </text>
</svg>
